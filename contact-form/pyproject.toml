[project]
name = "contact-form"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "John Silvell", email = "john.silvell@josil.se" }
]
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.159.1",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.40.0",
]

[project.scripts]
contact-form = "contact_form:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

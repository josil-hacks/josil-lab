name: Deploy to VPS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The complete history is required to compare the commits in a push.
          fetch-depth: 0

      - name: Check for Python changes
        id: python-changes
        shell: bash
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          else
            changed_files="$(git diff --name-only "${{ github.event.before }}" "$GITHUB_SHA")"
          fi

          if printf '%s\n' "$changed_files" | grep -qE '\.py$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.python-changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python quality tools
        if: steps.python-changes.outputs.changed == 'true'
        run: python -m pip install --upgrade ruff bandit

      - name: Lint Python code
        if: steps.python-changes.outputs.changed == 'true'
        run: ruff check .

      - name: Scan Python code for vulnerabilities
        if: steps.python-changes.outputs.changed == 'true'
        run: bandit --recursive . --exclude .git

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Logga in på GHCR på servern
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Gå till projektmappen på VPS och hämta ny container-version
            cd ~/webserver
            docker compose pull
            docker compose up -d --remove-orphans
